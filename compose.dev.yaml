services:
  api:
    build:
      target: development
    volumes:
      - ./apps/api:/app
    command: ["uv", "run", "uvicorn", "clinic_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  web:
    build:
      target: development
    volumes:
      - ./:/workspace
      - web_node_modules:/workspace/node_modules
    command: ["corepack", "pnpm", "dev", "--host", "0.0.0.0", "--port", "8080"]

volumes:
  web_node_modules:
